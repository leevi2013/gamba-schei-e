================================================================================

# Gamba Slot — Minecraft Java 1.21.11 / Fabric

Server-side Fabric mod mit einer blauen Chest-GUI und einer Erz-Slotmaschine.
Die Animation dauert zufällig 2–4 Sekunden. Nur drei gleiche Symbole in der
mittleren Reihe lösen eine Auszahlung aus.

## Funktionen

- `/gamba` öffnet das Menü mit 10 Coins Einsatz.
- `/gamba <einsatz>` öffnet das Menü mit deinem gewünschten Einsatz.
- `/gamba kontostand` zeigt deine virtuellen Coins.
- `/gamba hilfe` zeigt die Befehle.
- Einsätze von 0 oder weniger, Einsätze über dem Limit und nicht gedeckte
  Einsätze werden abgelehnt.
- Einsätze werden serverseitig verwaltet.
- Kontostände werden in `gamba-balances.properties` im Weltordner gespeichert.
- Neues Spielerkonto startet mit 1.000 virtuellen Coins.

## Multiplikatoren

| Symbol | Multiplikator |
|---|---:|
| Coal Ore | 0,5x |
| Iron Ore | 1,2x |
| Gold Ore | 2,0x |
| Diamond Ore | 5,0x |
| Emerald Ore | 10,0x |
| Ancient Debris / Netherite | 25,0x Jackpot |

Die Auszahlung ist der Gesamtbetrag einschließlich Einsatz.
100 Coins Einsatz bei drei Diamanterzen ergeben 500 Coins Auszahlung.

## Bauen über GitHub

1. Lade den kompletten Inhalt dieses Ordners in dein Repository hoch.
   Die Ordnerstruktur muss beibehalten werden.
2. Öffne den GitHub-Reiter Actions.
3. Der Workflow in `.github/workflows/main.yml` startet automatisch.
4. Wenn der Build erfolgreich ist, lade das Artefakt `gamba-slot-jar` herunter.
5. Die benutzbare Mod ist `gamba-slot-1.0.0.jar`, nicht die `-sources.jar`.

Beim manuellen Kopieren darfst du keine Markdown-Zeilen wie ```yaml oder ```
in `main.yml` einfügen. Diese Backticks gehören nicht in die tatsächliche Datei.

## Voraussetzungen

- Minecraft Java Edition 1.21.11
- Java 21
- Fabric Loader und Fabric API passend zu Minecraft 1.21.11

Die JAR muss in den Ordner `mods` des Fabric-Servers. Für Clients, die auf
einem Server spielen, gelten die üblichen Fabric-Mod-Abhängigkeiten.

## Hinweis

Dies ist ein Quellprojekt. Der Build wurde in dieser Umgebung nicht ausgeführt.
GitHub Actions muss erfolgreich durchlaufen, bevor die JAR im Spiel verwendet
werden kann. Die Coins haben nur virtuellen Spielwert und keinen realen Geldwert.


