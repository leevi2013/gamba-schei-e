# Gamba Slot — Minecraft Fabric 1.21.11

Eine serverseitige Minecraft-Java-Mod mit einer blauen, normalen Kisten-GUI als Erz-Slotmaschine.
Die Walzen laufen zufällig 2 bis 4 Sekunden. Es zählt nur, wenn am Ende alle drei Symbole in der mittleren Reihe gleich sind.

## Funktionen

- Blaue Glasfenster als GUI-Hintergrund und klare, getrennte Slot-Positionen.
- `/gamba` öffnet die Maschine mit einem Einsatz von 10 Coins.
- `/gamba <einsatz>` öffnet sie mit deinem Einsatz, zum Beispiel `/gamba 25`.
- `/gamba kontostand` zeigt deine virtuellen Coins.
- `/gamba hilfe` zeigt die Befehle.
- Einsätze <= 0 sowie Einsätze über dem Maximum werden abgelehnt.
- Beim Drehen wird geprüft, ob genug Coins vorhanden sind.
- Startguthaben: 1.000 virtuelle Coins pro Spieler.
- Kontostände werden in `gamba-balances.properties` im Weltordner gespeichert.
- Der Einsatz wird vor der Animation abgezogen.
- Bei drei gleichen Symbolen wird Einsatz × Multiplikator ausgezahlt.
- Kohleerz mit 0,5x zahlt die Hälfte des Einsatzes zurück.

## Multiplikatoren

| Symbol | Multiplikator |
|---|---:|
| Coal Ore | 0,5x |
| Iron Ore | 1,2x |
| Gold Ore | 2,0x |
| Diamond Ore | 5,0x |
| Emerald Ore | 10,0x |
| Ancient Debris / Netherite | 25,0x — Jackpot |

Die Auszahlung ist der Gesamtbetrag, der zurückkommt, nicht der Nettogewinn.
Beispiel: Bei einem Einsatz von 100 Coins und drei Diamanterzen werden 500 Coins ausgezahlt. Nach Abzug des Einsatzes beträgt der Nettogewinn 400 Coins.

## Voraussetzungen

- Minecraft Java Edition 1.21.11
- Java JDK 21
- Fabric Loader und Fabric API passend für 1.21.11

Die Mod läuft serverseitig. Für einen Multiplayer-Server gehört die gebaute Mod-JAR in den Ordner `mods` des Fabric-Servers.

